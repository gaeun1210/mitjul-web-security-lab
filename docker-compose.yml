# 밑줄(Mitjul) 보안 실습 랩 - Docker 구성 (v2)
# vulnerable(취약) / secure(보완) 두 벌을 같은 DB 서버의 서로 다른 스키마로 띄웁니다.
#   - 취약 버전:  http://localhost:8001   (127.0.0.1 로만 바인딩 — 외부 노출 안 함)
#   - 보완 버전:  http://localhost:8080
#
# 접속 정보는 .env 에서 주입합니다 (cp .env.example .env 후 값 설정).
#
# 실행:  docker compose up --build
# 종료:  docker compose down          (데이터 유지)
# 초기화: docker compose down -v       (DB 볼륨까지 삭제 후 재시드)

services:
  db:
    image: mariadb:11
    container_name: mitjul-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # [보완 9] 앱 계정 비밀번호도 .env 에서만 받음 → db/users.sh 가 계정 생성에 사용
      VULN_DB_USER: ${VULN_DB_USER}
      VULN_DB_PASS: ${VULN_DB_PASS}
      SECURE_DB_USER: ${SECURE_DB_USER}
      SECURE_DB_PASS: ${SECURE_DB_PASS}
    volumes:
      - mitjul-db-data:/var/lib/mysql
      # 최초 1회(볼륨이 비어 있을 때)만, 파일 이름 순서대로 실행됩니다.
      #   10-schema.sql : DB·테이블·시드 데이터 (비밀번호 없음)
      #   20-users.sh   : .env 값으로 앱 전용 계정 생성 + 최소 권한 부여
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/users.sh:/docker-entrypoint-initdb.d/20-users.sh:ro
    # DB 포트는 외부로 열지 않습니다 (앱 컨테이너에서 내부 네트워크로만 접근).
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  vulnerable:
    build: ./docker
    container_name: mitjul-vulnerable
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_MODE: vulnerable
      DB_HOST: db
      DB_NAME: mitjul_vuln
      DB_USER: ${VULN_DB_USER}
      DB_PASS: ${VULN_DB_PASS}
    volumes:
      - ./app/vulnerable:/var/www/html
    # 업로드 폴더는 호스트에서 마운트되므로 시작할 때 웹 서버 사용자(www-data)에게 쓰기 권한을 맞춰 줌
    command: ["bash", "-c", "chown -R www-data:www-data /var/www/html/uploads && exec apache2-foreground"]
    ports:
      # 127.0.0.1 로만 바인딩 — VMware 밖(실습망 외부)에서 취약 서버에 못 들어오게.
      - "127.0.0.1:8001:80"

  secure:
    build: ./docker
    container_name: mitjul-secure
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_MODE: secure
      DB_HOST: db
      DB_NAME: mitjul_secure
      DB_USER: ${SECURE_DB_USER}
      DB_PASS: ${SECURE_DB_PASS}
      # [보완 10] true 일 때만 비밀번호 재설정 인증코드를 화면에 표시 (기본 false = 기능 비활성)
      RESET_DEV_MODE: ${RESET_DEV_MODE:-false}
    volumes:
      - ./app/secure:/var/www/html
    # 업로드 폴더는 호스트에서 마운트되므로 시작할 때 웹 서버 사용자(www-data)에게 쓰기 권한을 맞춰 줌
    command: ["bash", "-c", "chown -R www-data:www-data /var/www/html/uploads && exec apache2-foreground"]
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mitjul-db-data:
